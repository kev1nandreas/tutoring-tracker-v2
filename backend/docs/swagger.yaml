        automatically).
      parameters:
      - description: Tutorial ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Deleted
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not found
          schema:
            type: string
        "409":
          description: Tutorial still has payments
          schema:
            type: string
      security:
      - JwtAuth: []
      summary: Delete a tutorial by ID
      tags:
      - tutorial
    get:
      description: A tutor token can only read tutorials the tutor created.
      parameters:
      - description: Tutorial ID
        in: path
        name: id
        required: true
