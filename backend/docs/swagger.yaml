basePath: /api/v1
definitions:
  dto.AttachmentResponse:
    properties:
      content_type:
        type: string
      created_at:
        type: string
      external:
        description: External is true for old rows that point at a web link instead
          of a stored file.
        type: boolean
      id:
        type: string
      meeting_id:
        type: string
      name:
        type: string
      size:
        type: integer
      type:
        type: string
    type: object
  dto.CompleteUploadsRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.CompletedUpload'
        maxItems: 20
        minItems: 1
        type: array
    required:
    - items
    type: object
  dto.CompletedUpload:
    properties:
      key:
        type: string
      name:
        maxLength: 100
        type: string
      type:
        type: string
    required:
    - key
    - name
    - type
    type: object
  dto.CreateMeetingRequest:
    properties:
      date:
        format: date
        type: string
      has_homework:
        type: boolean
      is_done:
        type: boolean
      marks:
        type: string
      text_homework:
        type: string
      time_end:
        example: "17:30"
        type: string
      time_start:
        example: "16:00"
        type: string
      title:
        type: string
      tutorial_id:
        type: string
      youtube_link:
        type: string
    required:
    - date
    - time_end
    - time_start
    - title
    - tutorial_id
    type: object
  dto.CreatePaymentRequest:
    properties:
      is_paid:
        type: boolean
      nominal:
        type: integer
      note:
        type: string
      payment_date:
        type: integer
      tutorial_id:
        type: string
      user_id:
        type: string
    required:
    - nominal
    - tutorial_id
    type: object
  dto.CreateRoleRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  dto.CreateSubmissionRequest:
    properties:
      answer:
        type: string
      files:
        type: string
    required:
    - files
    type: object
  dto.CreateTutorialRequest:
    properties:
      bundle_include_homework:
        type: boolean
      bundle_include_recordings:
        description: Download package contents; omitted means recordings off, homework
          on.
        type: boolean
      date_ended:
        format: date
        type: string
      date_started:
        format: date
        type: string
      description:
        type: string
      is_done:
        type: boolean
      meeting_days:
        type: integer
      name:
        type: string
      show_attendance:
        type: boolean
      show_download:
        type: boolean
      show_feedback:
        type: boolean
    required:
    - date_ended
    - date_started
    - name
    type: object
  dto.DownloadResponse:
    properties:
      content_type:
        type: string
      expires_in:
        type: integer
      inline:
        description: true when the browser can show it in place
        type: boolean
      name:
        type: string
      type:
        type: string
      url:
        type: string
    type: object
  dto.EnrollRequest:
    properties:
      tutorial_code:
        type: string
    required:
    - tutorial_code
    type: object
  dto.EnrolledTutorial:
    properties:
      can_attend:
        description: 'CanAttend: the tutor turned on attendance (by photo) for this
          class.'
        type: boolean
      can_download:
        description: 'CanDownload: the tutor turned on "download everything" for this
          class.'
        type: boolean
      custom_id:
        type: string
      date_ended:
        type: string
      date_started:
        type: string
      description:
        type: string
      done_meetings:
        type: integer
      id:
        type: string
      is_done:
        type: boolean
      name:
        type: string
      next_meeting_date:
        type: string
      total_meetings:
        type: integer
      tutor_name:
        type: string
    type: object
  dto.EnrollmentTutorial:
    properties:
      custom_id:
        type: string
      date_ended:
        description: YYYY-MM-DD
        type: string
      date_started:
        description: YYYY-MM-DD
        type: string
      description:
        type: string
      is_done:
        type: boolean
      name:
        type: string
    type: object
  dto.FormInfo:
    properties:
      open:
        description: Open is true when the tutorial is done and its feedback switch
          is on.
        type: boolean
      tutor_name:
        type: string
      tutorial_name:
        type: string
    type: object
  dto.GoogleLoginRequest:
    properties:
      id_token:
        type: string
    required:
    - id_token
    type: object
  dto.GradeSubmissionRequest:
    properties:
      feedback:
        maxLength: 500
        type: string
      grade:
        maximum: 100
        minimum: 0
        type: integer
    required:
    - grade
    type: object
  dto.Income:
    properties:
      month:
        description: YYYY-MM
        type: string
      payments_month:
        type: integer
      payments_year:
        type: integer
      this_month:
        type: integer
      this_year:
        type: integer
      year:
        type: integer
    type: object
  dto.Item:
    properties:
      created_at:
        type: string
      delivery_rating:
        type: integer
      interactive_rating:
        type: integer
      learn_again_rating:
        type: integer
      message:
        type: string
      unclear_topics:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/dto.MeResponse'
    type: object
  dto.MarkRequest:
    properties:
      key:
        type: string
    required:
    - key
    type: object
  dto.MeResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      last_login_at:
        type: string
      name:
        type: string
      phone:
        type: string
      role:
        type: string
      role_id:
        type: string
      school:
        type: string
      username:
        type: string
    type: object
  dto.MeetingItem:
    properties:
      date:
        type: string
      has_homework:
        type: boolean
      id:
        type: string
      time_end:
        type: string
      time_start:
        type: string
      title:
        type: string
      tutorial_id:
        type: string
      tutorial_name:
        type: string
    type: object
  dto.MyAttendance:
    properties:
      can_mark:
        description: 'CanMark is true on the meeting''s day: the only day a check-in
          is accepted.'
        type: boolean
      marked:
        type: boolean
      marked_at:
        type: string
      photo_url:
        description: PhotoURL is a short-lived link to the photo, only when marked.
        type: string
    type: object
  dto.MyEnrollment:
    properties:
      id:
        type: string
      requested_at:
        description: |-
          RequestedAt is when the student asked; DecidedAt when the status last changed
          (equal to RequestedAt while still pending).
        type: string
      status:
        description: pending, accepted or declined
        type: string
      tutorial:
        $ref: '#/definitions/dto.EnrollmentTutorial'
      updated_at:
        type: string
    type: object
  dto.PaymentResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_paid:
        type: boolean
      nominal:
        type: integer
      note:
        type: string
      payment_date:
        type: integer
      student_name:
        type: string
      tutorial:
        $ref: '#/definitions/dto.PaymentTutorial'
      tutorial_id:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  dto.PaymentTutorial:
    properties:
      date_ended:
        type: string
      date_started:
        type: string
      name:
        type: string
    type: object
  dto.PendingAttachment:
    properties:
      date:
        type: string
      meeting_id:
        type: string
      title:
        type: string
      tutorial_id:
        type: string
      tutorial_name:
        type: string
    type: object
  dto.PendingHomework:
    properties:
      date:
        type: string
      meeting_id:
        type: string
      text_homework:
        type: string
      title:
        type: string
      tutorial_id:
        type: string
      tutorial_name:
        type: string
    type: object
  dto.PendingStudent:
    properties:
      created_at:
        type: string
      id:
        type: string
      last_login_at:
        description: LastLoginAt is nil until the student logs in for the first time.
        type: string
      name:
        type: string
      school:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      phone:
        type: string
      school:
        type: string
      username:
        type: string
    required:
    - email
    - name
    - password
    - phone
    - school
    - username
    type: object
  dto.RequestResponse:
    properties:
      download_url:
        description: DownloadURL is a short-lived link, present only while status
          is ready.
        type: string
      error:
        type: string
      expires_at:
        type: string
      file_count:
        type: integer
      id:
        type: string
      status:
        description: Status is queued, preparing, ready, failed or expired.
        type: string
      total_bytes:
        type: integer
    type: object
  dto.Roster:
    properties:
      present:
        type: integer
      students:
        items:
          $ref: '#/definitions/dto.StudentAttendance'
        type: array
      total:
        type: integer
    type: object
  dto.Status:
    properties:
      code:
        description: Code is the tutorial code the public form lives under.
        type: string
      required:
        type: boolean
    type: object
  dto.StudentAttendance:
    properties:
      marked_at:
        type: string
      name:
        type: string
      photo_url:
        type: string
      present:
        type: boolean
      user_id:
        type: string
      username:
        type: string
    type: object
  dto.StudentDashboard:
    properties:
      enrolled_tutorials:
        items:
          $ref: '#/definitions/dto.TutorialItem'
        type: array
      pending_homework:
        items:
          $ref: '#/definitions/dto.PendingHomework'
        type: array
      upcoming_tutorials:
        items:
          $ref: '#/definitions/dto.TutorialItem'
        type: array
    type: object
  dto.StudentDetail:
    properties:
      email:
        type: string
      id:
        type: string
      last_login_at:
        description: LastLoginAt is nil until the student logs in for the first time.
        type: string
      name:
        type: string
      phone:
        type: string
      school:
        type: string
      tutorial_count:
        type: integer
      tutorials:
        items:
          $ref: '#/definitions/dto.StudentTutorial'
        type: array
      username:
        type: string
    type: object
  dto.StudentMeeting:
    properties:
      date:
        type: string
      has_homework:
        type: boolean
      id:
        type: string
      is_done:
        type: boolean
      text_homework:
        type: string
      time_end:
        type: string
      time_start:
        type: string
      title:
        type: string
      tutorial_id:
        type: string
      video_id:
        description: VideoID is the 11-character YouTube id, or empty when there is
          no valid recording.
        type: string
    type: object
  dto.StudentRow:
    properties:
      email:
        type: string
      id:
        type: string
      last_login_at:
        description: LastLoginAt is nil until the student logs in for the first time.
        type: string
      name:
        type: string
      phone:
        type: string
      school:
        type: string
      tutorial_count:
        type: integer
      username:
        type: string
    type: object
  dto.StudentTutorial:
    properties:
      attended:
        type: integer
      avg_grade:
        description: AvgGrade is the mean of the graded homework (0-100); nil when
          nothing is graded.
        type: number
      custom_id:
        type: string
      is_done:
        type: boolean
      name:
        type: string
      status:
        description: 'Status is the enrollment state: pending, accepted or declined.'
        type: string
      submitted:
        type: integer
      total_meetings:
        type: integer
      tutorial_id:
        type: string
    type: object
  dto.SubmissionResponse:
    properties:
      answer:
        type: string
      created_at:
        type: string
      feedback:
        type: string
      files:
        type: string
      grade:
        type: integer
      graded_at:
        type: string
      id:
        type: string
      meeting_id:
        type: string
      updated_at:
        type: string
      user:
        $ref: '#/definitions/dto.SubmissionUser'
      user_id:
        type: string
    type: object
  dto.SubmissionUser:
    properties:
      id:
        type: string
      name:
        type: string
      school:
        type: string
      username:
        type: string
    type: object
  dto.SubmitRequest:
    properties:
      delivery_rating:
        description: '1-5: how well the tutor delivered the material, how interactive,
          and wanting to learn with them again.'
        maximum: 5
        minimum: 1
        type: integer
      email:
        maxLength: 100
        type: string
      interactive_rating:
        maximum: 5
        minimum: 1
        type: integer
      learn_again_rating:
        maximum: 5
        minimum: 1
        type: integer
      message:
        description: 'Message: impressions and advice for the tutor.'
        maxLength: 2000
        type: string
      unclear_topics:
        description: 'UnclearTopics: what the student did not understand and wants
          covered next.'
        maxLength: 2000
        type: string
    required:
    - delivery_rating
    - email
    - interactive_rating
    - learn_again_rating
    - message
    - unclear_topics
    type: object
  dto.Summary:
    properties:
      avg_delivery:
        type: number
      avg_interactive:
        type: number
      avg_learn_again:
        type: number
      count:
        type: integer
      items:
        items:
          $ref: '#/definitions/dto.Item'
        type: array
    type: object
  dto.TutorDashboard:
    properties:
      active_tutorials:
        items:
          $ref: '#/definitions/dto.TutorialItem'
        type: array
      income:
        $ref: '#/definitions/dto.Income'
      pending_attachments:
        items:
          $ref: '#/definitions/dto.PendingAttachment'
        type: array
      upcoming_meetings:
        items:
          $ref: '#/definitions/dto.MeetingItem'
        type: array
    type: object
  dto.TutorialItem:
    properties:
      custom_id:
        type: string
      date_ended:
        type: string
      date_started:
        type: string
      description:
        type: string
      done_meetings:
        type: integer
      id:
        type: string
      is_enrolled:
        type: boolean
      name:
        type: string
      next_meeting_date:
        description: |-
          Student view: next meeting date of an enrolled tutorial, or whether the
          student is enrolled in an upcoming one.
        type: string
      students:
        description: 'Tutor view: accepted students. Student view: always 0.'
        type: integer
      total_meetings:
        type: integer
    type: object
  dto.TutorialPendingGroup:
    properties:
      pending_validations:
        items:
          $ref: '#/definitions/dto.PendingStudent'
        type: array
      tutorial:
        $ref: '#/definitions/dto.TutorialSummary'
    type: object
  dto.TutorialSummary:
    properties:
      custom_id:
        type: string
      name:
        type: string
    type: object
  dto.UpdateMeetingRequest:
    properties:
      date:
        format: date
        type: string
      has_homework:
        type: boolean
      is_done:
        type: boolean
      marks:
        type: string
      text_homework:
        type: string
      time_end:
        example: "17:30"
        type: string
      time_start:
        example: "16:00"
        type: string
      title:
        type: string
      youtube_link:
        type: string
    type: object
  dto.UpdatePaymentRequest:
    properties:
      is_paid:
        type: boolean
      nominal:
        type: integer
      note:
        type: string
      payment_date:
        type: integer
      tutorial_id:
        type: string
      user_id:
        type: string
    type: object
  dto.UpdateRoleRequest:
    properties:
      name:
        type: string
    type: object
  dto.UpdateTutorialRequest:
    properties:
      bundle_include_homework:
        type: boolean
      bundle_include_recordings:
        type: boolean
      date_ended:
        format: date
        type: string
      date_started:
        format: date
        type: string
      description:
        type: string
      is_done:
        type: boolean
      meeting_days:
        type: integer
      name:
        type: string
      show_attendance:
        type: boolean
      show_download:
        type: boolean
      show_feedback:
        type: boolean
    type: object
  dto.UpdateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      phone:
        type: string
      role_id:
        type: string
      school:
        type: string
      username:
        type: string
    type: object
  dto.ValidateRequest:
    properties:
      action:
        enum:
        - accept
        - decline
        type: string
      tutorial_code:
        type: string
      user_ids:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - action
    - tutorial_code
    - user_ids
    type: object
  dto.ValidateResponse:
    properties:
      skipped:
        description: Skipped are ids that had no pending request for this tutorial.
        items:
          type: string
        type: array
      updated:
        description: Updated are the students whose status changed.
        items:
          type: string
        type: array
    type: object
  entity.Job:
    properties:
      created_at:
        type: string
      end_time:
        type: integer
      id:
        type: string
      is_success:
        type: boolean
      messages:
        type: string
      start_time:
        type: string
      updated_at:
        type: string
    type: object
  entity.Meeting:
    properties:
      created_at:
        type: string
      date:
        type: string
      has_homework:
        type: boolean
      id:
        type: string
      is_done:
        type: boolean
      marks:
        type: string
      text_homework:
        type: string
      time_end:
        type: string
      time_start:
        type: string
      title:
        type: string
      tutorial_id:
        type: string
      updated_at:
        type: string
      youtube_link:
        type: string
    type: object
  entity.Notification:
    properties:
      body:
        type: string
      created_at:
        type: string
      header:
        type: string
      id:
        type: string
      is_read:
        type: boolean
      type:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  entity.PendingValidation:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_validated:
        description: 0 pending, 1 accepted, 2 declined
        type: integer
      tutorial_id:
        type: string
      updated_at:
        type: string
      user:
        $ref: '#/definitions/entity.User'
      user_id:
        type: string
    type: object
  entity.Role:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  entity.Tutorial:
    properties:
      bundle_include_homework:
        type: boolean
      bundle_include_recordings:
        description: |-
          What the "download everything" package contains besides the files (needs show_download):
          the YouTube recording links, and the homework instructions with the student's own result.
        type: boolean
      created_at:
        type: string
      created_by:
        type: string
      custom_id:
        type: string
      date_ended:
        type: string
      date_started:
        type: string
      description:
        type: string
      id:
        type: string
      is_done:
        type: boolean
      meeting_days:
        type: integer
      name:
        type: string
      show_attendance:
        type: boolean
      show_download:
        type: boolean
      show_feedback:
        type: boolean
      updated_at:
        type: string
    type: object
  entity.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      last_login_at:
        type: string
      name:
        type: string
      phone:
        type: string
      role:
        $ref: '#/definitions/entity.Role'
      role_id:
        type: string
      school:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  github_com_kev1nandreas_go-rest-api-template_src_modules_attachment_dto.UploadTicket:
    properties:
      content_type:
        type: string
      expires_in:
        description: seconds
        type: integer
      fields:
        additionalProperties:
          type: string
        type: object
      key:
        type: string
      upload_url:
        type: string
    type: object
  github_com_kev1nandreas_go-rest-api-template_src_modules_attachment_dto.UploadTicketRequest:
    properties:
      name:
        maxLength: 100
        type: string
      size:
        type: integer
      type:
        type: string
    required:
    - name
    - size
    - type
    type: object
  github_com_kev1nandreas_go-rest-api-template_src_modules_attendance_dto.UploadTicket:
    properties:
      content_type:
        type: string
      expires_in:
        description: seconds
        type: integer
      fields:
        additionalProperties:
          type: string
        type: object
      key:
        type: string
      upload_url:
        type: string
    type: object
  github_com_kev1nandreas_go-rest-api-template_src_modules_attendance_dto.UploadTicketRequest:
    properties:
      name:
        maxLength: 100
        type: string
      size:
        type: integer
