      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.TutorialPendingGroup'
            type: array
        "403":
          description: Only tutors
          schema:
            type: string
      security:
      - JwtAuth: []
      summary: List enrollment requests of all my tutorials, grouped by tutorial
      tags:
      - pending-validation
  /pending-validations/enroll:
    post:
      consumes:
      - application/json
      description: A student submits the tutorial code and waits as pending until
        the tutor validates.
      parameters:
      - description: Tutorial code
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.EnrollRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/entity.PendingValidation'
        "403":
          description: Only students
          schema:
            type: string
        "404":
          description: Tutorial not found
          schema:
            type: string
        "409":
          description: Already enrolled or pending
          schema:
            type: string
      security:
      - JwtAuth: []
      summary: Enroll in a tutorial with its code
      tags:
      - pending-validation
  /pending-validations/mine:
    get:
      description: Only students. Newest change first. status is pending, accepted
        or declined.
      parameters:
      - default: 1
        description: Page
        in: query
        name: page
        type: integer
      - default: 10
        description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.MyEnrollment'
            type: array
        "403":
          description: Only students
          schema:
            type: string
      security:
      - JwtAuth: []
      summary: List my enrollment requests and their status
      tags:
      - pending-validation
  /pending-validations/validate:
    post:
      consumes:
      - application/json
      description: Only the tutor who created the tutorial. Only students still pending
        are changed; others are returned in "skipped".
      parameters:
      - description: Tutorial code, student user ids and action (accept or decline)
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.ValidateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ValidateResponse'
        "403":
          description: Not your tutorial
          schema:
            type: string
        "404":
          description: Tutorial not found
          schema:
            type: string
      security:
      - JwtAuth: []
      summary: Accept or decline students in bulk
      tags:
      - pending-validation
  /public/feedback/{code}:
    get:
      description: No login needed. code is the tutorial code.
      parameters:
      - description: Tutorial code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.FormInfo'
        "404":
          description: Not found
          schema:
            type: string
      summary: 'Public feedback form: tutorial details'
      tags:
      - feedback
    post:
      consumes:
      - application/json
      description: No login needed. Only works while the tutorial's feedback switch
        is on. The email is only hashed to stop a second submission; answers are stored
        without it. A second submission with the same email returns 409.
      parameters:
      - description: Tutorial code
        in: path
        name: code
        required: true
        type: string
      - description: Feedback
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.SubmitRequest'
      produces:
      - application/json
      responses:
        "201":
          description: "true"
          schema:
            type: boolean
        "400":
          description: Bad Request
          schema:
            type: string
        "403":
          description: Feedback closed
          schema:
            type: string
        "409":
          description: Already submitted
          schema:
            type: string
      summary: 'Public feedback form: send feedback'
      tags:
      - feedback
