basePath: /api/v1
definitions:
  dto.AttachmentInput:
    properties:
      link:
        type: string
      name:
        type: string
      type:
        type: string
    required:
    - link
    - name
    - type
    type: object
  dto.CreateAttachmentsRequest:
    properties:
      attachments:
        items:
          $ref: '#/definitions/dto.AttachmentInput'
        maxItems: 50
        minItems: 1
        type: array
    required:
    - attachments
    type: object
  dto.CreateMeetingRequest:
    properties:
      date:
        format: date
        type: string
      has_homework:
        type: boolean
      is_done:
        type: boolean
      marks:
        type: string
      text_homework:
        type: string
      time_end:
        example: "17:30"
        type: string
      time_start:
        example: "16:00"
        type: string
      title:
        type: string
      tutorial_id:
        type: string
      youtube_link:
        type: string
    required:
    - date
    - time_end
    - time_start
    - title
    - tutorial_id
    type: object
  dto.CreatePaymentRequest:
    properties:
      is_paid:
        type: boolean
      nominal:
        type: integer
      note:
        type: string
      payment_date:
        type: integer
      tutorial_id:
        type: string
      user_id:
        type: string
    required:
    - tutorial_id
    - user_id
    type: object
  dto.CreateRoleRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  dto.CreateSubmissionRequest:
    properties:
      answer:
        type: string
      files:
        type: string
    required:
    - files
    type: object
  dto.CreateTutorialRequest:
    properties:
      date_ended:
        format: date
        type: string
      date_started:
        format: date
        type: string
      description:
        type: string
      is_done:
        type: boolean
      meeting_days:
        type: integer
      name:
        type: string
      show_attendance:
        type: boolean
      show_download:
        type: boolean
      show_feedback:
        type: boolean
    required:
    - date_ended
    - date_started
    - name
    type: object
  dto.EnrollRequest:
    properties:
      tutorial_code:
        type: string
    required:
    - tutorial_code
    type: object
  dto.GradeSubmissionRequest:
    properties:
      feedback:
        maxLength: 500
        type: string
      grade:
        maximum: 100
        minimum: 0
        type: integer
    required:
    - grade
    type: object
  dto.Income:
    properties:
      month:
        description: YYYY-MM
        type: string
      payments_month:
        type: integer
      payments_year:
        type: integer
      this_month:
        type: integer
      this_year:
        type: integer
      year:
        type: integer
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/dto.MeResponse'
    type: object
  dto.MeResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      last_login_at:
        type: string
      name:
        type: string
      phone:
        type: string
      role:
        type: string
      role_id:
        type: string
      school:
        type: string
      username:
        type: string
    type: object
  dto.MeetingItem:
    properties:
      date:
        type: string
      has_homework:
        type: boolean
      id:
        type: string
      time_end:
        type: string
      time_start:
        type: string
      title:
        type: string
      tutorial_id:
        type: string
      tutorial_name:
        type: string
    type: object
  dto.PaymentResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_paid:
        type: boolean
      nominal:
        type: integer
      note:
        type: string
      payment_date:
        type: integer
      tutorial:
        $ref: '#/definitions/dto.PaymentTutorial'
      tutorial_id:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  dto.PaymentTutorial:
    properties:
      date_ended:
        type: string
      date_started:
        type: string
      name:
        type: string
    type: object
  dto.PendingAttachment:
    properties:
      date:
        type: string
      meeting_id:
        type: string
      title:
        type: string
      tutorial_id:
        type: string
      tutorial_name:
        type: string
    type: object
  dto.PendingHomework:
    properties:
      date:
        type: string
      meeting_id:
        type: string
      text_homework:
        type: string
      title:
        type: string
      tutorial_id:
        type: string
      tutorial_name:
        type: string
    type: object
  dto.PendingStudent:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      school:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      phone:
        type: string
      school:
        type: string
      username:
        type: string
    required:
    - email
    - name
    - password
    - phone
    - school
    - username
    type: object
  dto.StudentDashboard:
    properties:
      enrolled_tutorials:
        items:
          $ref: '#/definitions/dto.TutorialItem'
        type: array
      pending_homework:
        items:
          $ref: '#/definitions/dto.PendingHomework'
        type: array
      upcoming_tutorials:
        items:
          $ref: '#/definitions/dto.TutorialItem'
        type: array
    type: object
  dto.SubmissionResponse:
    properties:
      answer:
        type: string
      created_at:
        type: string
      feedback:
        type: string
      files:
        type: string
      grade:
        type: integer
      graded_at:
        type: string
      id:
        type: string
      meeting_id:
        type: string
      updated_at:
        type: string
      user:
        $ref: '#/definitions/dto.SubmissionUser'
      user_id:
        type: string
    type: object
  dto.SubmissionUser:
    properties:
      id:
        type: string
      name:
        type: string
      school:
        type: string
      username:
        type: string
    type: object
  dto.TutorDashboard:
    properties:
      active_tutorials:
        items:
          $ref: '#/definitions/dto.TutorialItem'
        type: array
      income:
        $ref: '#/definitions/dto.Income'
      pending_attachments:
        items:
          $ref: '#/definitions/dto.PendingAttachment'
        type: array
      upcoming_meetings:
        items:
          $ref: '#/definitions/dto.MeetingItem'
        type: array
    type: object
  dto.TutorialItem:
    properties:
      custom_id:
        type: string
      date_ended:
        type: string
      date_started:
        type: string
      description:
        type: string
      done_meetings:
        type: integer
      id:
        type: string
      is_enrolled:
        type: boolean
      name:
        type: string
      next_meeting_date:
        description: |-
          Student view: next meeting date of an enrolled tutorial, or whether the
          student is enrolled in an upcoming one.
        type: string
      students:
        description: 'Tutor view: accepted students. Student view: always 0.'
        type: integer
      total_meetings:
        type: integer
    type: object
  dto.TutorialPendingGroup:
    properties:
      pending_validations:
        items:
          $ref: '#/definitions/dto.PendingStudent'
        type: array
      tutorial:
        $ref: '#/definitions/dto.TutorialSummary'
    type: object
  dto.TutorialSummary:
    properties:
      custom_id:
        type: string
      name:
        type: string
    type: object
  dto.UpdateMeetingRequest:
    properties:
      date:
        format: date
        type: string
      has_homework:
        type: boolean
      is_done:
        type: boolean
      marks:
        type: string
      text_homework:
        type: string
      time_end:
        example: "17:30"
        type: string
      time_start:
        example: "16:00"
        type: string
      title:
        type: string
      youtube_link:
        type: string
    type: object
  dto.UpdatePaymentRequest:
    properties:
      is_paid:
        type: boolean
      nominal:
        type: integer
      note:
        type: string
      payment_date:
        type: integer
      tutorial_id:
        type: string
      user_id:
        type: string
    type: object
  dto.UpdateRoleRequest:
    properties:
      name:
        type: string
    type: object
  dto.UpdateTutorialRequest:
    properties:
      date_ended:
        format: date
        type: string
      date_started:
        format: date
        type: string
      description:
        type: string
      is_done:
        type: boolean
      meeting_days:
        type: integer
      name:
        type: string
      show_attendance:
        type: boolean
      show_download:
        type: boolean
      show_feedback:
        type: boolean
    type: object
  dto.UpdateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      phone:
        type: string
      role_id:
        type: string
      school:
        type: string
      username:
        type: string
    type: object
  dto.ValidateRequest:
    properties:
      action:
        enum:
        - accept
        - decline
        type: string
      tutorial_code:
        type: string
      user_ids:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - action
    - tutorial_code
    - user_ids
    type: object
  dto.ValidateResponse:
    properties:
      skipped:
        description: Skipped are ids that had no pending request for this tutorial.
        items:
          type: string
        type: array
      updated:
        description: Updated are the students whose status changed.
        items:
          type: string
        type: array
    type: object
  entity.Attachment:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      id:
        type: string
      link:
        type: string
      meeting_id:
        type: string
      name:
        type: string
      type:
        type: string
      updated_at:
        type: string
    type: object
  entity.Job:
    properties:
      created_at:
        type: string
      end_time:
        type: integer
      id:
        type: string
      is_success:
        type: boolean
      messages:
        type: string
      start_time:
        type: string
      updated_at:
        type: string
    type: object
  entity.Meeting:
    properties:
      created_at:
        type: string
      date:
        type: string
      has_homework:
        type: boolean
      id:
        type: string
      is_done:
        type: boolean
      marks:
        type: string
      text_homework:
        type: string
      time_end:
        type: string
      time_start:
        type: string
      title:
        type: string
      tutorial_id:
        type: string
      updated_at:
        type: string
      youtube_link:
        type: string
    type: object
  entity.Notification:
    properties:
      body:
        type: string
      created_at:
        type: string
      header:
        type: string
      id:
        type: string
      is_read:
        type: boolean
      type:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  entity.PendingValidation:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_validated:
        description: 0 pending, 1 accepted, 2 declined
        type: integer
      tutorial_id:
        type: string
      updated_at:
        type: string
      user:
        $ref: '#/definitions/entity.User'
      user_id:
        type: string
    type: object
  entity.Role:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  entity.Tutorial:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      custom_id:
        type: string
      date_ended:
        type: string
      date_started:
        type: string
      description:
        type: string
      id:
        type: string
      is_done:
        type: boolean
      meeting_days:
        type: integer
      name:
        type: string
      show_attendance:
        type: boolean
      show_download:
        type: boolean
      show_feedback:
        type: boolean
      updated_at:
        type: string
    type: object
  entity.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      last_login_at:
        type: string
      name:
        type: string
      phone:
        type: string
      role:
        $ref: '#/definitions/entity.Role'
      role_id:
        type: string
      school:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: localhost:8082
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is a sample server celler server.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Swagger Example API
  version: "1.0"
paths:
  /:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Health check
      tags:
      - health
  /attachments/{id}:
    delete:
      description: Only the user who created the attachment.
      parameters:
      - description: Attachment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Deleted
          schema:
            type: string
        "403":
          description: Not the creator
          schema:
            type: string
        "404":
          description: Not found
          schema:
            type: string
      security:
      - JwtAuth: []
      summary: Delete an attachment
      tags:
      - attachment
  /dashboard/student:
    get:
      description: Pending homework, upcoming tutorials and enrolled active tutorials.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.StudentDashboard'
        "403":
          description: Forbidden
          schema:
            type: string
      security:
      - JwtAuth: []
      summary: Student dashboard
      tags:
      - dashboard
  /dashboard/tutor:
    get:
      description: Upcoming meetings, active tutorials, income this month/year and
        meetings still missing an attachment. Tutor sees own tutorials; admin sees
        all.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TutorDashboard'
        "403":
          description: Forbidden
          schema:
            type: string
      security:
      - JwtAuth: []
      summary: Tutor dashboard
      tags:
      - dashboard
  /jobs:
    get:
      description: Paginated. Non-text columns (ids, flags, numbers, dates) can be
        used as exact filters, e.g. ?role_id=<uuid>
      parameters:
      - default: 1
        description: Page
        in: query
        name: page
        type: integer
      - default: 10
        description: Page size
        in: query
        name: page_size
        type: integer
      - description: Sort column
        in: query
        name: sort
        type: string
      - description: asc or desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/entity.Job'
            type: array
      summary: List jobs with pagination
      tags:
      - job
  /jobs/{id}:
    get:
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.Job'
        "404":
          description: Not found
          schema:
            type: string
      summary: Get a job by ID
      tags:
      - job
  /login:
    post:
      consumes:
      - application/json
      description: Authenticates a user using email and password, returns a JWT token
        if successful
      parameters:
      - description: User login object
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: Authenticate a user
      tags:
      - user
  /me:
    get:
      description: Returns the authenticated user's id, profile and role
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MeResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
      security:
      - JwtAuth: []
      summary: Get the current user
      tags:
      - user
  /meetings:
    get:
      description: Paginated. Non-text columns (ids, flags, numbers, dates) can be
        used as exact filters, e.g. ?role_id=<uuid>
      parameters:
      - default: 1
        description: Page
        in: query
        name: page
        type: integer
      - default: 10
        description: Page size
        in: query
        name: page_size
        type: integer
      - description: Sort column
        in: query
        name: sort
        type: string
      - description: asc or desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/entity.Meeting'
            type: array
      summary: List meetings with pagination
      tags:
      - meeting
    post:
      consumes:
      - application/json
      description: Only the tutor who created the tutorial (or an admin) can add meetings.
        date is YYYY-MM-DD; time_start and time_end are HH:MM in the app timezone.
      parameters:
      - description: Create meeting
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.CreateMeetingRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/entity.Meeting'
        "400":
          description: Bad Request
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
      security:
      - JwtAuth: []
      summary: Create a meeting
      tags:
      - meeting
  /meetings/{id}:
    delete:
      description: Only the tutor who created the tutorial (or an admin) can delete
        its meetings.
      parameters:
      - description: Meeting ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Deleted
          schema:
            type: string
        "404":
          description: Not found
          schema:
            type: string
      security:
      - JwtAuth: []
      summary: Delete a meeting by ID
      tags:
      - meeting
    get:
      parameters:
      - description: Meeting ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.Meeting'
        "404":
          description: Not found
          schema:
            type: string
      summary: Get a meeting by ID
      tags:
      - meeting
    put:
      consumes:
      - application/json
      description: Only the tutor who created the tutorial (or an admin) can update
        its meetings.
      parameters:
      - description: Meeting ID
        in: path
        name: id
        required: true
        type: string
      - description: Update meeting
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateMeetingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.Meeting'
        "404":
          description: Not found
          schema:
            type: string
      security:
      - JwtAuth: []
      summary: Update a meeting by ID
      tags:
      - meeting
  /meetings/{id}/attachments:
    get:
      parameters:
      - description: Meeting ID
        in: path
        name: id
        required: true
        type: string
      - default: 1
        description: Page
        in: query
        name: page
        type: integer
      - default: 10
        description: Page size
        in: query
        name: page_size
        type: integer
      - description: Sort column
        in: query
        name: sort
        type: string
      - description: asc or desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/entity.Attachment'
            type: array
        "404":
          description: Meeting not found
          schema:
            type: string
      security:
      - JwtAuth: []
      summary: List attachments of a meeting with pagination
      tags:
      - attachment
    post:
      consumes:
      - application/json
      description: Up to 50 per request, saved all or nothing. The creator is taken
        from the JWT.
      parameters:
      - description: Meeting ID
        in: path
        name: id
        required: true
        type: string
      - description: Attachments
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.CreateAttachmentsRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            items:
              $ref: '#/definitions/entity.Attachment'
            type: array
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Meeting not found
          schema:
            type: string
      security:
      - JwtAuth: []
      summary: Add one or many attachments to a meeting
      tags:
      - attachment
  /meetings/{id}/submissions:
    get:
      description: Includes the submitting user (id, name, username, school), grade
        and feedback. A student only sees their own submissions; a tutor only those
        of their own tutorials; an admin sees all.
      parameters:
      - description: Meeting ID
        in: path
        name: id
        required: true
        type: string
      - default: 1
        description: Page
        in: query
        name: page
        type: integer
      - default: 10
        description: Page size
        in: query
        name: page_size
        type: integer
      - description: Sort column
        in: query
        name: sort
        type: string
      - description: asc or desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.SubmissionResponse'
            type: array
        "404":
          description: Meeting not found
          schema:
            type: string
      security:
      - JwtAuth: []
      summary: List submissions of a meeting with pagination
      tags:
      - submission
    post:
