services:
  backend:
    container_name: ${APP_NAME}
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 127.0.0.1:${APP_PORT}:${APP_PORT}
    depends_on:
      - db
      - mongo
    environment:
      APP_DEBUG: ${APP_DEBUG}
      APP_MONGO_LOGGING: ${APP_MONGO_LOGGING}
      APP_URL_PROD: ${APP_URL_PROD}
      APP_PORT: ${APP_PORT}
      APP_MIGRATIONS: ${APP_MIGRATIONS}
      API_SECRET_KEY: ${API_SECRET_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Tutoring Tracker}
      PERSONAL_WEBSITE_URL: ${PERSONAL_WEBSITE_URL:-}
      PERSONAL_WEBSITE_API_KEY: ${PERSONAL_WEBSITE_API_KEY:-}
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_PUBLIC_USE_SSL: ${MINIO_PUBLIC_USE_SSL}
      STORAGE_UPLOAD_URL_EXPIRY_MINUTES: ${STORAGE_UPLOAD_URL_EXPIRY_MINUTES}
      STORAGE_DOWNLOAD_URL_EXPIRY_MINUTES: ${STORAGE_DOWNLOAD_URL_EXPIRY_MINUTES}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      RABBITMQ_USE_SSL: ${RABBITMQ_USE_SSL}
      MONGO_HOST: mongo
      MONGO_PORT: ${MONGO_PORT}
      MONGO_DATABASE: ${MONGO_DATABASE}
      MONGO_COLLECTION: ${MONGO_COLLECTION}
      MONGO_NOTIFICATION_COLLECTION: ${MONGO_NOTIFICATION_COLLECTION}
    networks:
      - default
      - shared

  db:
    image: postgres:14.1-alpine
    restart: always
    container_name: dockerPostgres-${APP_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:${POSTGRES_PORT}:${POSTGRES_PORT}
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    command: -p ${POSTGRES_PORT}

  mongo:
    image: mongo
    container_name: dockerMongo-${APP_NAME}
    volumes:
      - mongo_data:/data/db
    ports:
      - 127.0.0.1:${MONGO_PORT}:${MONGO_PORT}
    command: mongod --port ${MONGO_PORT} --bind_ip_all
    restart: always

volumes:
  mongo_data: {}
  pg_data: {}

networks:
  shared:
    name: shared_net
    external: true
