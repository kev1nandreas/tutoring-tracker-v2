  /pending-validations:
    get:
      description: Only tutors. Covers only tutorials the caller created. Paginated
        over tutorials. Filter with ?is_validated=0|1|2 (0 pending, 1 accepted, 2
        declined).
      parameters:
      - default: 1
        description: Page
        in: query
        name: page
        type: integer
      - default: 10
        description: Page size
        in: query
        name: page_size
        type: integer
      - description: 0 pending, 1 accepted, 2 declined
        in: query
        name: is_validated
        type: integer
      - description: Search students by name, username or school
        in: query
        name: q
        type: string
